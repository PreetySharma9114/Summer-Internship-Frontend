<ion-content>
  <div class="page-container">
    <div class="page-header">
      <h1>My Campaigns</h1>
      <p>Manage all your campaigns.</p>
    </div>

    @for (campaign of campaigns; track campaign._id) {
      @if (campaign.title && campaign.description && campaign.category && campaign.platforms.length) {
        <app-campaign-card [campaign]="campaign"> </app-campaign-card>
      }
    }
  </div>
</ion-content>
